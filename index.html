<html>

<body>

<h1>Anti-Amyloid Medication Infusion Dates</h1>

<p id="infusionParameters">
 <form action="JavaScript:calculateInfusionDates()">
  <label for="antiAmyloidMedication">Anti-amyloid medication:</label>
  <select name="antiAmyloidMedication" id="antiAmyloidMedication" onchange="infusionNumberMax()">
   <option value="lecanemab">Leqembi (lecanemab)</option>
   <option value="donanemab">Kisunla (donanemab)</option>
  </select>
  <br><br>
  <label for="firstInfusion">Infusion #, date:</label>
  <input type="number" id="infusionNumber" min="1" style="width: 60px" value="1">
  <input type="date" id="firstInfusionDate">
  <br><br>
  <label for="user">User:</label>
  <select name="user" id="user">
   <option value="CarlyCorcoran" data-print="Carly Corcoran, RN">Corcoran, Carly [RN]</option>
   <option value="TrentSchmeling" data-print="Trent R Schmeling, MD">Schmeling, Trent [MD]</option>
  </select>
  <br><br>
  <input type="submit" value="Generate note">
 </form>
</p>

<p id="copyNote">
 <form action="JavaScript:copyNote()">
  <input type="submit" id="submit_copyNote" value="Copy note">
</form>
</p>

<p id="allInfusionDates"></p>

</body>

</html>

<script type="text/javascript">
 var g_pageVariables = [];

 setUpPage();

 function setUpPage()
 {
  for (let i = 0; i < window.location.search.substring(1).split("&").length; i++)
  {
   g_pageVariables.push(window.location.search.substring(1).split("&")[i]);
  }

  let dateNowGMT = new Date();
  let dateNowUTC = new Date(Date.UTC(dateNowGMT.getFullYear(), dateNowGMT.getMonth(), dateNowGMT.getDate()));

  document.getElementById("infusionNumber").setAttribute("max", "26");
  document.getElementById("firstInfusionDate").valueAsDate = dateNowUTC;

  for (let i = 0; i < document.getElementById("user").options.length; i++)
  {
   if (document.getElementById("user").options[i].value == getPageVariable("user"))
   {
    document.getElementById("user").value = getPageVariable("user");
    break;
   }
  }
 }

 function getPageVariable(varName)
 {
  for (let i = 0;  i < g_pageVariables.length; i++)
  {
   if (g_pageVariables[i].split("=")[0] == varName)
   {
    return g_pageVariables[i].split("=")[1];
   }
  }
  return "";
 }

 function calculateInfusionDates()
 {
  let dateNowGMT = new Date();
  let date1UTC = new Date(document.getElementById("firstInfusionDate").valueAsDate);
  let date1GMT = new Date(date1UTC.getFullYear(), date1UTC.getMonth(), date1UTC.getDate(), date1UTC.getHours() + date1UTC.getTimezoneOffset() / 60);

  document.getElementById("allInfusionDates").innerHTML = "<b>" + formatDate(dateNowGMT, "MM/dd/YY") + " Advocate Aurora Health Anti-amyloid Medication Target Dates</b><br><br>";

  document.getElementById("allInfusionDates").innerHTML += "Infusion # " +
   document.getElementById("infusionNumber").value + ": " +
   formatDate(date1GMT, "MM/dd/YY") + "<br>";
  if (document.getElementById("antiAmyloidMedication").value == "lecanemab")
  {
   for (let i = document.getElementById("infusionNumber").valueAsNumber + 1; i < 27; i++)
   {
    date1GMT.setDate(date1GMT.getDate() + 14);
    let date2GMT = new Date(date1GMT);
    date2GMT.setDate(date2GMT.getDate() - 7);
    document.getElementById("allInfusionDates").innerHTML += "Infusion # " + i + ": " + formatDate(date1GMT, "MM/dd/YY");
    if (i == 3 || i == 5 || i == 7 || i == 14 || i == 26)
    {
     document.getElementById("allInfusionDates").innerHTML += " * MRI on or around " + formatDate(date2GMT, "MM/dd/YY");
    }
    document.getElementById("allInfusionDates").innerHTML += "<br>";
   }
  }
  else if (document.getElementById("antiAmyloidMedication").value == "donanemab")
  {
   for (let i = document.getElementById("infusionNumber").valueAsNumber + 1; i < 14; i++)
   {
    date1GMT.setDate(date1GMT.getDate() + 28);
    let date2GMT = new Date(date1GMT);
    date2GMT.setDate(date2GMT.getDate() - 7);
    document.getElementById("allInfusionDates").innerHTML += "Infusion # " + i + ": " + formatDate(date1GMT, "MM/dd/YY");
    if (i == 2 || i == 3 || i == 4 || i == 7)
    {
     document.getElementById("allInfusionDates").innerHTML += " * MRI on or around " + formatDate(date2GMT, "MM/dd/YY");
    }
    document.getElementById("allInfusionDates").innerHTML += "<br>";
   }
  }

  document.getElementById("allInfusionDates").innerHTML += "<br>" +
   document.getElementById("user").options[document.getElementById("user").selectedIndex].getAttribute("data-print") +
   "<br>General Neurology<br>Advocate Aurora Health";
 }

 function copyNote()
 {
  let t_blobHTML = new Blob([document.getElementById("allInfusionDates").innerHTML], { type: "text/html" });
  let t_blobText = new Blob([document.getElementById("allInfusionDates").innerText], { type: "text/plain" });
  let t_blobData = [new ClipboardItem({["text/plain"]: t_blobText, ["text/html"]: t_blobHTML})];
  navigator.clipboard.write(t_blobData);
 }

 function infusionNumberMax()
 {
  if (document.getElementById("antiAmyloidMedication").value == "lecanemab")
  {
   document.getElementById("infusionNumber").setAttribute("max", "26");
  }
  else if (document.getElementById("antiAmyloidMedication").value == "donanemab")
  {
   document.getElementById("infusionNumber").setAttribute("max", "13");
  }
 }

 function formatDate(varDate, varFormat)
 {
  switch(varFormat)
  {
   case "MM/dd/YY":
    return (varDate.getMonth() + 1 < 10 ? '0' : '') + (varDate.getMonth() + 1) + "/" +
    (varDate.getDate() < 10 ? '0' : '') + (varDate.getDate()) + "/" +
    ('' + varDate.getFullYear()).slice(-2);
   case "MM-dd-YY":
    return (varDate.getMonth() + 1 < 10 ? '0' : '') + (varDate.getMonth() + 1) + "-" +
    (varDate.getDate() < 10 ? '0' : '') + (varDate.getDate()) + "-" +
    ('' + varDate.getFullYear()).slice(-2);
   default:
    return "";
  }
 }

</script>
